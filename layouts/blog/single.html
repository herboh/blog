{{ define "main" }}
<article class="article-shell">
  <header class="article-hero">
    <a class="back-link" href="{{ "/blog/" | relLangURL }}">Back to blog</a>
    <p class="eyebrow">Blog post</p>
    <h1 class="article-title">{{ .Title }}</h1>

    <div class="article-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      <span>{{ .ReadingTime }} min read</span>
      <span>{{ .WordCount }} words</span>
    </div>

    {{ with .Description }}
    <p class="page-intro">{{ . }}</p>
    {{ end }}

    {{ with .Params.tags }}
    <div class="post-card__tags">
      {{ range . }}
      <a class="tag-pill" href="{{ printf "/tags/%s/" (. | urlize) | relLangURL }}">#{{ . }}</a>
      {{ end }}
    </div>
    {{ end }}
  </header>

  <div class="article-body prose">
    {{ .Content }}
  </div>

  <footer class="article-footer">
    <a class="section-link" href="{{ "/blog/" | relLangURL }}">More posts</a>
  </footer>
</article>
{{ end }}
