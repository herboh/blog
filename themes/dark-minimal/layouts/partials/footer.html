<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-copy">
      <p>© {{ now.Format "2006" }} {{ with .Site.Params.authorName }}{{ . }}{{ else }}{{ .Site.Title }}{{ end }}</p>
      <p>Static Hugo site. Fast, small, and intentionally not an app.</p>
    </div>

    <div class="social-icons" aria-label="External links">
      {{ with .Site.Params.github }}
      <a href="https://github.com/{{ . }}" target="_blank" rel="noopener noreferrer" title="GitHub">GitHub</a>
      {{ end }}
    </div>
  </div>
</footer>
