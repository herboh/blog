# Books page source of truth.
# Keep entries in the order you want them displayed, usually newest first.
# `isbn` is preferred because `scripts/sync_books.py` can resolve metadata and fetch
# a local cover from Hardcover first when `HARDCOVER_TOKEN` is set.
# `hardcover_id` is an optional explicit Hardcover book id if you want to pin a match.
# `cover_source` is an optional fallback URL for books that need a manual cover hint.
# `cover_file` is an optional local public path override such as
# `/images/books/custom-cover.jpg`.

