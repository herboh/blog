# Public presentation settings. Credentials and account identifiers do not belong here.
timezone = "America/New_York"
# auto selects Tautulli when it has data, otherwise Letterboxd. Never adds both totals.
movies_source = "auto"
# Optional Steam app IDs to omit from ALL exported views and totals.
exclude_steam_apps = []
# Only publish these Steam app IDs when nonempty; empty publishes all returned games.
include_steam_apps = []
# Named favorites are editorial, distinct from most-played / highest-rated rankings.
# Example:
# [[favorites]]
# kind = "games" # music, games, books, or movies
# title = "A favorite game"
# note = "Why I keep coming back."
# url = "https://store.steampowered.com/app/123/"
